name: overnight-search
on:
  workflow_dispatch:
  schedule:
    - cron: "37 14 * * 0"   # Sundays, after the intraday alpha-search
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m src.backtest.overnight_search
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "overnight-search cycle report"
          file_pattern: "reports/*.md data/quarantine_overnight.json"
