# All tunables live here. Change thresholds in config, not in code.

alpaca:
  env: paper   # live is code-locked until every roadmap gate passes (see README)

universe:   # liquid megacaps + index ETFs, long-only v1
  - SPY
  - QQQ
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - META
  - GOOGL
  - TSLA
  - AMD
  - NFLX
  - AVGO
  - JPM
  - BAC
  - XOM
  - CVX
  - UNH
  - V
  - MA
  - COST

backtest:
  start: "2024-07-01"
  end: null            # null = yesterday
  timeframe: 5Min
  feed: sip            # free plan includes historical SIP; auto-falls back to iex

costs:
  slippage_cents: 1    # per share, per side (entries buy higher, exits sell lower)

risk:
  equity: 100000       # fixed per-trade sizing base (no compounding in backtest)
  risk_pct: 0.5        # % of equity risked per trade via stop distance
  max_position_pct: 20 # position value cap
  flat_by_et: "15:50"  # everything closed by here, never hold overnight

strategies:
  orb:
    open_bars: 3       # first 15 minutes
    cutoff_et: "11:30"
    rr: 2.0
    max_risk_frac: 0.02
  vwap_revert:
    z_entry: 1.5
    stop_sigmas: 1.0
    sigma_window: 12
    start_et: "10:00"
    end_et: "15:00"
  momentum:
    confirm_bar: 12    # 10:30 ET on 5-min bars
    rr: 2.0
    stop_lookback: 6
    max_risk_frac: 0.015

gate:   # a strategy must clear ALL of these (on VALIDATION) for Phase 2 eligibility
  min_trades: 100
  min_expectancy_r: 0.05
  min_profit_factor: 1.15
  min_quarters_positive_frac: 0.6

research:   # Phase 1.5 disciplined sweep - grids PRE-DECLARED, gate applies to validation only
  train_start: "2024-07-01"
  train_end: "2025-12-31"
  val_start: "2026-01-01"
  val_end: null            # null = yesterday
  min_train_trades: 150
  min_train_expectancy_r: 0.02   # winner below this on TRAIN -> labeled WEAK PASS
  slippage_sensitivity_cents: [0.5, 2.0]
  # market-context params for the opt-in regime/relative-strength filters
  regime_open_bars: 3
  regime_cutoff_et: "10:30"
  # walk-forward: the winner must be positive across MOST sequential folds of the
  # validation window - not just the pooled slice. Single biggest overfit defense.
  walkforward:
    folds: 4
    min_positive_frac: 0.6
  grids:
    orb:   # focused: fixed the picked-over params, sweep the NEW hypotheses (filters)
      side: [long]
      open_bars: [3]
      rr: [1.5, 2.0]
      cutoff_et: ["10:30"]
      vol_confirm: [false]
      min_or_width_frac: [null, 0.004]   # volatility floor: skip dead-tape days
      regime_filter: [false, true]       # only go long when SPY is breaking up
      rs_topk: [null, 5]                 # only trade the K strongest names vs SPY
    vwap_revert:
      side: [long, short]
      z_entry: [1.5, 2.0, 2.5]
      stop_sigmas: [1.0, 1.5]
      chop_filter: [false, true]
      time_stop_bars: [12, 24]
    momentum:
      side: [long, short]
      rr: [2.0, 3.0]
      stop_lookback: [6, 12]
      hold_above: [3, 6]
      time_stop_bars: [24, 36]

strategy10:   # Peter's 3-step "boring" scalp ported from the FX repo - RESEARCH ONLY, own simulator.
  # 1-minute execution: daily 9/21 EMA direction, prev-day high/low ZONES + the first
  # 5-minute opening range, break-and-retest entry, swing-TRAILING stop, flat 15:50 ET.
  # Runs on 1Min bars (5x the 5Min data), so the universe is a liquid subset to keep the
  # download/sim tractable in a manual workflow. Judged on the same gate as everything else.
  universe: [SPY, QQQ, AAPL, MSFT, NVDA, AMZN, META, TSLA, AMD, GOOGL]
  timeframe: 1Min
  feed: sip                 # historical SIP on the free plan; auto-falls back to IEX
  open_bars: 5              # first 5 one-minute bars = the opening range
  cutoff_et: "15:50"        # no logic beyond flat time; entries allowed through the session
  ema_fast: 9
  ema_slow: 21
  zone_frac: 0.05           # PDH/PDL zone half-width = zone_frac x prev-day range
  stop_buf_frac: 0.10       # initial stop behind broken level = stop_buf_frac x prev-day range
  min_stop_cost_mult: 2.0   # skip setups whose initial stop < 2x round-trip slippage
  train_start: "2024-07-01"
  train_end: "2025-12-31"
  val_start: "2026-01-01"
  val_end: null
  min_train_trades: 100
  min_train_expectancy_r: 0.02
  slippage_sensitivity_cents: [0.5, 2.0]
  walkforward:
    folds: 4
    min_positive_frac: 0.6
  grids:
    trail_lookback: [10, 20]
    trend_filter: [false, true]
    max_trades_day: [1, 2]
  # FORWARD paper-validation trial: the backtest winner is FROZEN here and measured
  # ONLY on data from lock_date onward - a fresh out-of-sample window nobody has
  # picked over. Pre-registered 2026-07-23 (see PRE_REGISTRATION_STRATEGY10.md).
  # NO moving goalposts: these are the numbers, unchanged, until the sample is reached.
  forward:
    frozen:                 # the [BACKTEST-S10] validation winner - not re-searched
      trail_lookback: 20
      trend_filter: false
      max_trades_day: 2
    lock_date: "2026-07-23"
    warmup_days: 30         # fetched before lock_date so prev-day levels/EMA exist; NOT scored
    interim_trades: 100     # first honest look
    target_trades: 300      # meaningful sample for a verdict
    gate:                   # same bar as everything else
      min_trades: 100
      min_expectancy_r: 0.05
      min_profit_factor: 1.15
      min_quarters_positive_frac: 0.6

live:   # Phase 2 paper deployment - PROMOTED filtered ORB.
  # PASS on 2026-07-18: train +0.105R/PF1.334 AND validation +0.082R/PF1.289 agree,
  # survives 2c slippage, walk-forward 3/4 folds. This is a CANDIDATE on a fresh
  # 21-session paper trial (see PRE_REGISTRATION.md) - a backtest edge being tested
  # live, NOT proven money and NOT eligible for real capital.
  strategy: orb
  feed: iex            # free real-time feed for the intraday loop
  poll_seconds: 120
  session_start_et: "09:35"
  max_positions: 5     # matches rs_topk=5 breadth the backtest tested (worst-case day ~ -2.5%)
  params:
    open_bars: 3
    cutoff_et: "10:30"
    rr: 1.5
    vol_confirm: false
    max_risk_frac: 0.02
    min_or_width_frac: 0.004   # volatility floor - skip dead-tape openings
    regime_filter: true        # only go long when SPY is itself breaking up
    rs_topk: 5                 # only trade the 5 strongest names vs SPY each morning
  premarket:
    enabled: true
    guard_mode: log_only        # log_only | enforce - stays log_only until evidence supports enforcing
    halt_spy_gap_pct: 1.5       # would-halt if SPY gaps more than this overnight
    skip_symbol_gap_pct: 4.0    # would-skip symbols gapping more than this (earnings/news days)
    llm_model: claude-haiku-4-5-20251001   # used only if ANTHROPIC_API_KEY secret is set

arming:   # kill-switch: does the entry session place trades at all?
  # manual = trade regardless of verdict (preserves the pre-registered THE MONTH
  #          measurement of the ORB logging-benchmark, even though its gate = FAIL).
  # auto   = obey data/arming.json written by research: only trade when a config
  #          actually cleared the gate + walk-forward. Flip to "auto" AFTER THE
  #          MONTH completes, so a genuine no-edge strategy cannot keep trading.
  mode: manual
  divergence:            # day-level live-vs-expected monitor (alerts; disarms in auto)
    enabled: true
    baseline_expectancy_r: 0.0   # honest prior for the benchmark: ~zero edge
    min_sessions: 10             # need this many logged days before judging
    max_drawdown_pct: 6.0        # alert if live paper drawdown exceeds this

futures_proxy:   # Stage 1: do ANY signals have edge on the INDEX (micro-futures proxy)? RESEARCH ONLY, manual dispatch.
  universe: [SPY, QQQ, DIA, IWM]
  proxy_map: {SPY: MES, QQQ: MNQ, DIA: MYM, IWM: M2K}
  strategies: [orb, vwap_revert, momentum]
  diag_strategy: momentum   # which WEAK-PASS/near-miss to scrutinize   # each tested on the index with its own pre-declared research grid

futures_stage2:   # Stage 2: LOCKED momentum on REAL futures (Databento). RESEARCH ONLY, manual dispatch.
  primary: [MES, MNQ, MYM]     # large-cap micros (pre-declared hypothesis)
  secondary: [M2K]             # Russell micro - reported, not required to pass
  databento:
    dataset: "GLBX.MDP3"
    schema: "ohlcv-1m"
    continuous_suffix: ".c.0"  # front month by volume
  start: "2023-07-01"
  end: null                    # null = latest
  val_start: "2023-07-01"      # ALL futures data is out-of-sample (params locked on stocks) -> judge on full span
  timeframe: "5Min"            # resampled from 1m so confirm_bar=12 == ~10:30 ET
  max_cost_usd: 30.0           # ABORT the download if Databento estimates more than this (free credit is $125)
  skip_cost_check: false       # true only to bypass the pre-flight cost guard
  commission_per_side: 0.50    # $/side/contract - VERIFY with your broker
  ticks_spread_per_side: 0.5   # half-tick spread assumption (optimistic; widen for MYM)
  locked_params:               # LOCKED Stage-1 winner - do NOT re-optimize on futures
    side: long
    confirm_bar: 12
    rr: 3.0
    stop_lookback: 12
    hold_above: 3
    time_stop_bars: 24
    max_risk_frac: 0.015

tsmom:   # diversified trend-following (time-series momentum) - the one evidence-backed futures approach. RESEARCH ONLY.
  universe: [ES, NQ, YM, RTY, ZN, ZB, ZF, ZT, 6E, 6J, 6B, 6A, 6C, GC, SI, HG, CL, NG, ZC, ZS, ZW]
  databento:
    dataset: "GLBX.MDP3"
    continuous_suffix: ".v.0"   # volume roll (follows liquidity)
  start: "2010-06-08"
  end: null
  oos_start: "2019-01-01"       # pick lookback on <2019, judge ONCE on >=2019
  lookbacks: [63, 126, 252]     # 3 / 6 / 12-month trailing-return sign
  vol_window: 60
  target_vol: 0.10              # 10% annualized per-market vol target
  cost_per_turnover: 0.0005     # realistic futures cost in return/vol space
  cost_sensitivity: [0.001, 0.002]
  max_cost_usd: 32.0
  skip_cost_check: false
  roll: naive            # naive | smooth (diagnostic compares both)
  min_roll_days: 3
  cache_path: null       # set to data/tsmom_prices_naive.csv to reuse cached data ($0)
  force_refetch: false
  gate:
    min_sharpe: 0.5             # modest but real, AFTER costs, OUT-OF-SAMPLE
    min_wf_frac: 0.6
    wf_folds: 4
    max_drawdown: 0.5

alpha_search:   # continuous, MULTIPLE-TESTING + FORWARD-TESTED alpha search. RESEARCH ONLY.
  universe: [SPY, QQQ, AAPL, MSFT, NVDA, AMZN, TSLA, AMD]   # 8 liquid names (tractable + enough trades)
  search_start: "2024-01-01"    # ~1.5y search window (keeps a run to minutes, not an hour)
  search_end: "2025-06-30"
  forward_start: "2025-07-01"   # fresh held-out window - survivors must ALSO pass here
  forward_end: null
  dsr_threshold: 0.95
  min_trades: 30
  forward_min_trades: 20
  search_space:                 # ~40 pre-declared hypotheses per run (widen once timing is confirmed)
    orb:
      side: [long, short]
      open_bars: [3]
      rr: [1.5, 2.0, 3.0]
      cutoff_et: ["10:30"]
      vol_confirm: [false, true]
    vwap_revert:
      side: [long, short]
      z_entry: [1.5, 2.0, 2.5]
      stop_sigmas: [1.0, 1.5]
    momentum:
      side: [long, short]
      rr: [2.0, 3.0]
      stop_lookback: [6, 12]
      hold_above: [3, 6]
    or_fade:
      side: [long, short]
      ext_frac: [0.002, 0.004]
      rr: [1.0, 1.5]
    intraday_reversal:
      side: [long, short]
      move_frac: [0.004, 0.008]
      rr: [1.0, 1.5]
    gap:
      mode: [fade, go]
      min_gap: [0.003, 0.006]
      rr: [1.0, 1.5]
      stop_frac: [0.004]
